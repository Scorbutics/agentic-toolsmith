<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="agentic-toolsmith">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <mask id="wrench-cut">
      <rect width="128" height="128" fill="#fff"/>
      <!-- open jaw, facing top-right -->
      <rect x="-7.5" y="-30" width="15" height="25" rx="2" fill="#000" transform="translate(86 42) rotate(45)"/>
      <!-- hole in the handle -->
      <circle cx="35" cy="93" r="4" fill="#000"/>
    </mask>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- terminal prompt -->
  <g fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="22,24 34,35 22,46"/>
    <line x1="42" y1="46" x2="56" y2="46"/>
  </g>

  <!-- wrench -->
  <g mask="url(#wrench-cut)" fill="#e2e8f0">
    <line x1="35" y1="93" x2="80" y2="48" stroke="#e2e8f0" stroke-width="15" stroke-linecap="round"/>
    <circle cx="86" cy="42" r="20"/>
  </g>
</svg>
